<button 
  onclick="openInBrowser()" 
  style="background:#833AB4; color:#fff; padding:12px 20px; border:none; border-radius:10px; font-size:16px; cursor:pointer;">
  🔗 Открыть калькулятор в браузере
</button>

<script>
function openInBrowser() {
  // 👉 вставь сюда свою реальную ссылку с /exec
  const url = "https://script.google.com/macros/s/AKfycbw6QIyQwyh78ASlLuGYDWukuPaZayR1TEODhQwep5b2UbqCn1GexDccgO1nHwdIv-MOBw/exec"; 

  const ua = navigator.userAgent || navigator.vendor || window.opera;

  if (/android/i.test(ua)) {
    // Android → открыть в Chrome
    window.location.href = "intent://" + url.replace(/^https?:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;end";
  } 
  else if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
    // iOS → сначала пробуем Chrome, если нет — Safari
    window.location.href = "googlechrome://" + url.replace(/^https?:\/\//, "");
    setTimeout(() => { window.location.href = url; }, 500); 
  } 
  else {
    // ПК и другие устройства → обычное открытие
    window.open(url, "_blank");
  }
}
</script>
